<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idrak cluster</title>
<!-- The cluster dashboard (plan 23, phase C9): one self-contained page, no address outside this server, works offline.
     The cluster drawn as it is: each machine a rack, each card cut into its ranks, each link drawn as what it is (a switch,
     a Wi-Fi router, an InfiniBand fabric, a cable, an NVLink bridge, a wire inside a machine) with its speed. Every figure
     comes from the dashboard's server (the topology builder, the inspection, the runs' records); nothing is fixed here. -->
<style>
:root {
  color-scheme: dark;
  --bg: #070b12; --stage: #080d14; --panel: #0c121a; --well: #0a1018; --line: #1a2431; --line2: #263243; --line3: #2c394a;
  --fg: #e6edf3; --muted: #9fb0c2; --dim: #6f8196; --soft: #c9d4e0;
  --teal: #3fb8a4; --teal-bg: #0f2420; --teal-fg: #9be8da; --teal-line: #1d4a42;
  --amber: #f0c56c; --amber-bg: #1c170c; --amber-line: #5c4a1f;
  --red: #ff8a80; --red-bg: #1d1012; --red-line: #5a2a26;
  --blue: #9fc8ee;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Arabic", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
button, input, select, textarea { font: inherit; }
input, select, textarea { background: var(--well); color: var(--fg); border: 1px solid var(--line2); border-radius: 7px; min-height: 36px; padding: 0 10px; font-size: 13px; min-width: 0; }
textarea { padding: 8px 10px; resize: vertical; font-family: var(--mono); font-size: 12px; }
input:disabled, button:disabled, select:disabled { opacity: .45; cursor: not-allowed; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
.mono { font-family: var(--mono); }
.hidden { display: none !important; }
.wrap { max-width: 1680px; margin: 0 auto; padding: 16px 24px 28px; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; font-size: 19px; } .brand b { font-weight: 600; } .brand span { color: var(--muted); }
.chip { font-family: var(--mono); font-size: 12px; color: var(--muted); background: #0f1720; border: 1px solid #1f2a37; border-radius: 6px; padding: 4px 8px; max-width: min(52vw, 620px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.dirty { color: var(--amber); border-color: var(--amber-line); }
.pill { font-size: 11px; font-weight: 500; padding: 1px 8px; border-radius: 999px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line3); background: #1c2633; color: var(--soft); }
.pill.teal { background: var(--teal-bg); color: var(--teal-fg); border-color: var(--teal-line); }
.pill.amber { background: #2a2212; color: var(--amber); border-color: var(--amber-line); }
.pill.red { background: #3a1d1a; color: var(--red); border-color: #6b2a26; }
.pill.orange { background: #3a1a12; color: #f6a58a; border-color: #6b2e1e; }
.pill.blue { background: #1c2633; color: var(--blue); border-color: var(--line3); }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: #6f8196; }
.live-dot.on { background: #ff5c5c; animation: livepulse 1.6s infinite; }
.btn { min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line3); background: #0f1720; color: var(--fg); cursor: pointer; font-size: 13px; }
.btn.primary { border: 0; background: var(--teal); color: #08201c; font-weight: 600; }
.btn.teal { border-color: var(--teal-line); background: var(--teal-bg); color: #bff3ea; }
.btn.danger { border-color: var(--red-line); background: var(--red-bg); color: #f3b1a9; }
.btn.fault { border-color: var(--amber-line); background: var(--amber-bg); color: var(--amber); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 30px; padding: 0 10px; font-size: 12px; }
.btn.big { min-height: 44px; font-weight: 600; }
.seg { flex: 1 1 0; min-height: 34px; padding: 0 10px; border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 500; border: 1px solid var(--line2); background: var(--well); color: var(--soft); white-space: nowrap; }
.seg[aria-pressed="true"] { border-color: var(--teal); background: #173a33; color: #bff3ea; }
.step { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 10px; cursor: pointer; color: var(--fg); border: 1px solid #1f2a37; background: var(--well); }
.step[aria-current="step"] { border-color: var(--teal); background: var(--teal-bg); }
.step .n { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; background: #1c2633; color: var(--muted); }
.step[aria-current="step"] .n { background: var(--teal); color: #08201c; }
.step .t { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2; } .step .t b { font-size: 13px; } .step .t span { font-size: 11px; color: var(--muted); }
.notice { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
.notice.bad { border-color: #6b2a26; background: var(--red-bg); color: #f3b1a9; }
.notice.warn { border-color: var(--amber-line); background: var(--amber-bg); color: var(--amber); }
.main { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
.scene { flex: 1 1 720px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; align-items: center; }
.key { display: flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; border: 1px solid #1f2a37; opacity: .5; color: var(--muted); font-family: var(--mono); font-size: 11px; }
.key.on { opacity: 1; color: var(--fg); }
.key i { width: 18px; border-radius: 2px; flex: 0 0 auto; }
.switch { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 10px 0 4px; border-radius: 999px; border: 1px solid var(--line3); background: var(--well); color: var(--muted); font-size: 12px; font-weight: 500; cursor: pointer; }
.switch[aria-checked="true"] { border-color: var(--teal); background: var(--teal-bg); color: #bff3ea; }
.switch i { width: 30px; height: 18px; border-radius: 999px; background: radial-gradient(circle at 30% 50%, #e6edf3 0 6px, transparent 7px), #263243; }
.switch[aria-checked="true"] i { background: radial-gradient(circle at 70% 50%, #e6edf3 0 6px, transparent 7px), var(--teal); }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.zoom { display: flex; align-items: center; border: 1px solid var(--line3); border-radius: 8px; overflow: hidden; }
.zoom button { min-height: 32px; min-width: 32px; border: 0; background: #0f1720; color: var(--fg); cursor: pointer; }
.zoom span { font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 0 6px; min-width: 38px; text-align: center; }
.stage-wrap { width: 100%; max-height: 80vh; overflow: auto; border-radius: 14px; border: 1px solid var(--line); background: var(--stage); }
.stage { position: relative; background-color: var(--stage); background-image: radial-gradient(ellipse at 50% 50%, rgba(63,184,164,.07) 0%, rgba(8,13,20,0) 60%), linear-gradient(#0e1620 1px, transparent 1px), linear-gradient(90deg, #0e1620 1px, transparent 1px); background-size: 100% 100%, 32px 32px, 32px 32px; }
.stage svg.wire { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: visible; }
.wchip { position: absolute; z-index: 4; box-sizing: border-box; font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 0 8px; border-radius: 999px; cursor: grab; touch-action: none; background: rgba(7,11,18,.95); border: 1px solid; white-space: nowrap; user-select: none; }
.hub { position: absolute; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: grab; touch-action: none; user-select: none; }
.hub .box { width: 136px; padding: 6px 8px; border-radius: 6px; background: linear-gradient(#1c2532, #121923); border: 1px solid; box-shadow: 0 0 0 3px #0a0f16, 0 6px 16px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 5px; }
.hub .box .top { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 10px; letter-spacing: .08em; color: var(--soft); }
.hub .ports { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; }
.hub .ports i { height: 7px; border-radius: 1px; background: #1a2330; }
.hub .label { font-family: var(--mono); font-size: 10px; white-space: nowrap; }
.led { width: 6px; height: 6px; border-radius: 50%; background: #7bd66f; animation: led 1.2s linear infinite; }
.rack { position: absolute; z-index: 2; overflow: hidden; display: flex; flex-direction: column; gap: 5px; padding: 8px 14px; border-radius: 6px; background-color: #0c1219;
  background-image: repeating-linear-gradient(180deg, #2c3846 0 2px, transparent 2px 9px), repeating-linear-gradient(180deg, #2c3846 0 2px, transparent 2px 9px);
  background-size: 5px 100%, 5px 100%; background-position: left 3px top 0, right 3px top 0; background-repeat: no-repeat; border: 2px solid #2a3646; box-shadow: 0 10px 24px rgba(0,0,0,.55); }
.rack.coord { border-color: #2c6b60; } .rack.sel { border-color: #bfe3f0; box-shadow: 0 0 0 3px rgba(191,227,240,.15); } .rack.slow { border-color: #c0582f; } .rack.mini { gap: 3px; padding: 6px 10px; }
.rack .head { display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #151d28; border: 1px solid #2a3646; border-radius: 4px; padding: 3px 6px; color: var(--fg); cursor: grab; touch-action: none; user-select: none; min-height: 24px; text-align: start; }
.rack .head .nm { font-family: var(--mono); font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rack .power { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: #7bd66f; box-shadow: 0 0 6px #7bd66f; }
.rack .nic { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; color: var(--muted); padding: 0 2px; }
.rack .nic i { width: 10px; height: 8px; border-radius: 1px; }
.unit { display: flex; flex-direction: column; gap: 3px; padding: 5px 6px; border-radius: 5px; background: #0b1118; border: 1px solid #1f2a37; }
.rack.mini .unit { padding: 3px; }
.unit .top { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 10px; color: var(--soft); }
.unit .top span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.unit .total { font-family: var(--mono); font-size: 10px; color: var(--dim); }
.body { display: flex; position: relative; overflow: hidden; border: 1px solid #33465a; }
.body.gpu { height: 40px; border-radius: 4px 4px 1px 1px; background: radial-gradient(circle at 25% 50%, #1b2430 0 9px, #26313f 10px 15px, transparent 16px), radial-gradient(circle at 75% 50%, #1b2430 0 9px, #26313f 10px 15px, transparent 16px), linear-gradient(180deg, #161e29, #10161e); }
.body.cpu { height: 30px; border-radius: 3px; border-color: #3b3566; background: radial-gradient(circle at 50% 50%, #2a2550 0 10px, transparent 11px), linear-gradient(180deg, #1a1830, #12111f); }
.rack.mini .body { height: 14px; }
.body.flow { border-color: #3fb8a4; box-shadow: 0 0 10px #3fb8a4; }
.body .tx { position: absolute; inset: 0; pointer-events: none; z-index: 1; opacity: 0; background: repeating-linear-gradient(90deg, transparent 0 14px, #3fb8a4cc 14px 18px, #ffffff 18px 20px, transparent 20px 34px); background-size: 34px 100%; }
.body.flow .tx { opacity: 1; animation: flowright .6s linear infinite; }
.slice { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 16px; border: 0; border-inline-end: 2px dashed rgba(7,11,18,.9); color: #fff; padding: 0; overflow: hidden; white-space: nowrap; cursor: pointer; }
.slice.gpu { background: rgba(63,184,164,.55); } .slice.cpu { background: rgba(139,124,240,.55); }
.slice.hot.gpu { background: rgba(95,224,203,.85); box-shadow: inset 0 0 12px rgba(255,255,255,.5); } .slice.hot.cpu { background: rgba(165,150,255,.85); box-shadow: inset 0 0 12px rgba(255,255,255,.5); }
.slice.slow { background: rgba(224,97,58,.75) !important; } .slice.gone { background: rgba(90,42,38,.8) !important; }
.slice b { font-family: var(--mono); font-size: 11px; } .slice small { font-family: var(--mono); font-size: 9px; opacity: .85; }
.slice.free { flex: 1 1 0; min-width: 14px; border: 0; background: repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 5px, transparent 5px 10px); color: var(--muted); }
.edge.gpu { height: 4px; margin: 0 12% 0 18%; border-radius: 0 0 2px 2px; background: repeating-linear-gradient(90deg, #c9a23e 0 3px, #6b5520 3px 5px); }
.edge.cpu { height: 3px; margin: 0 6%; background: repeating-linear-gradient(90deg, #8a8fa0 0 2px, transparent 2px 4px); }
.badge { display: inline-flex; align-items: center; gap: 3px; padding: 0 6px; min-height: 18px; border-radius: 999px; border: 1px solid; background: var(--well); font-family: var(--mono); font-size: 10px; font-weight: 600; cursor: pointer; }
.inlink { display: flex; align-items: center; gap: 6px; align-self: center; justify-content: center; background: transparent; border: 0; font-family: var(--mono); font-size: 10px; font-weight: 600; cursor: pointer; padding: 0 4px; min-height: 22px; }
.inlink.bridge { align-self: stretch; background: linear-gradient(90deg, #13240f, #1d3a17, #13240f); border: 1px solid; border-radius: 4px; padding: 2px 6px; }
.inlink .bar { width: 4px; height: 18px; border-radius: 2px; background-size: 100% 24px; }
.bolt { width: 9px; height: 14px; flex: 0 0 auto; }
.bolt.on { animation: boltpulse .8s ease-in-out infinite; }
aside { flex: 0 1 380px; min-width: 0; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
aside h3 { margin: 0; font-size: 15px; font-weight: 600; }
aside h4 { margin: 0; font-size: 13px; font-weight: 600; }
.part { display: contents; }
/* Arabic: the diagram is drawn by position, so it stays left to right; numbers with units and paths keep their own direction. */
[dir=rtl] .stage, [dir=rtl] .key { direction: ltr; }
[dir=rtl] .mono, [dir=rtl] .chip, [dir=rtl] .key, [dir=rtl] .wchip, [dir=rtl] .log, [dir=rtl] .kpi b, [dir=rtl] input, [dir=rtl] textarea { unicode-bidi: plaintext; }
.sec { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.small { font-size: 12px; } .tiny { font-size: 11px; } .muted { color: var(--muted); } .dim { color: var(--dim); } .good { color: var(--teal-fg); } .bad { color: var(--red); } .warn { color: var(--amber); }
.card { padding: 8px 10px; background: var(--well); border: 1px solid var(--line); border-radius: 8px; }
.devrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 12px; }
.suggest { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; background: var(--teal-bg); border: 1px solid var(--teal-line); border-radius: 8px; font-size: 12px; }
.lrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 40px; padding: 4px 10px; border-radius: 8px; cursor: pointer; color: var(--fg); background: var(--well); border: 1px solid var(--line); border-inline-start-width: 3px; text-align: start; width: 100%; }
.lrow.sel { background: #13202c; border-color: #bfe3f0; } .lrow.own { border-color: var(--amber-line); }
.lrow .who { display: flex; flex-direction: column; gap: 1px; min-width: 0; } .lrow .who span:first-child { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list { display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; }
.pred { display: grid; grid-template-columns: 100px 1fr 70px; align-items: center; gap: 8px; font-size: 12px; }
.meter { height: 8px; background: #16202c; border-radius: 4px; overflow: hidden; display: flex; }
.meter > div { height: 100%; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kpi { background: var(--well); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi span:first-child { font-size: 11px; color: var(--muted); } .kpi b { font-family: var(--mono); font-size: 18px; font-weight: 600; } .kpi span:last-child { font-size: 11px; color: var(--dim); }
.ribbon { display: flex; align-items: flex-end; gap: 2px; height: 56px; }
.ribbon > div { flex: 1 1 0; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 1px; }
.ribbon i { display: block; border-radius: 1px; }
.activity { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow-y: auto; }
.act { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; } .act i { width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; flex: 0 0 auto; background: currentColor; }
.log { font-family: var(--mono); font-size: 11px; background: var(--well); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-height: 180px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); }
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(3,6,10,.72); display: flex; align-items: center; justify-content: center; padding: 16px; }
.dialog { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.dialog h3 { margin: 0; font-size: 17px; }
.devpick { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 44px; padding: 6px 10px; border-radius: 8px; cursor: pointer; color: var(--fg); background: var(--well); border: 1px solid #1f2a37; text-align: start; width: 100%; }
.devpick[aria-pressed="true"] { background: var(--teal-bg); border-color: var(--teal); }
.preview { display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: repeating-linear-gradient(135deg, #0f1720 0 6px, #141d28 6px 12px); border: 1px solid var(--line2); }
.preview > div { display: flex; align-items: center; justify-content: center; font-size: 10px; font-family: var(--mono); overflow: hidden; color: #fff; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.rail button { writing-mode: vertical-rl; min-height: 120px; }
.fault-menu { display: flex; flex-direction: column; gap: 8px; padding: 10px; background: var(--amber-bg); border: 1px solid var(--amber-line); border-radius: 10px; }
[dir="rtl"] .ltr { direction: ltr; unicode-bidi: isolate; }
@keyframes livepulse { 0% { box-shadow: 0 0 0 0 rgba(255,92,92,.7); } 70% { box-shadow: 0 0 0 8px rgba(255,92,92,0); } 100% { box-shadow: 0 0 0 0 rgba(255,92,92,0); } }
@keyframes flowright { from { background-position: 0 0; } to { background-position: 34px 0; } }
@keyframes flowdown { from { background-position: 0 0; } to { background-position: 0 24px; } }
@keyframes led { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
@keyframes boltpulse { 0%, 100% { filter: none; } 50% { filter: drop-shadow(0 0 6px currentColor); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
@media (max-width: 720px) { .wrap { padding: 12px 16px 24px; } .kpis { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="row" style="gap: 12px">
      <div class="brand"><b>Idrak</b><span data-t="cluster">cluster</span></div>
      <span class="chip" id="file-chip"></span>
      <span class="pill hidden" id="live-pill"><i class="live-dot" id="live-dot"></i><span id="live-label"></span></span>
    </div>
    <div class="row">
      <nav class="row" aria-label="Steps" id="stepper" style="gap: 6px"></nav>
      <button type="button" class="btn primary big" id="b-save" data-t="Save">Save</button>
    </div>
  </header>
  <div id="message" class="notice hidden" role="status"></div>
  <div id="keybox" class="notice warn hidden row">
    <span data-t="This dashboard needs an API key from this machine.">This dashboard needs an API key from this machine.</span>
    <input id="key" type="password" class="mono" autocomplete="off" aria-label="API key">
    <button type="button" class="btn small" id="b-key" data-t="Use key">Use key</button>
  </div>

  <div class="main">
    <section class="scene" aria-label="The cluster">
      <div class="legend" id="legend" aria-label="Link colours"></div>
      <div class="toolbar">
        <div class="row"><span class="pill teal" id="shape-name"></span><span class="small muted" id="shape-note"></span></div>
        <div class="row" style="gap: 6px">
          <span class="tiny dim" data-t="drag a rack by its title, a box, or a speed label to bend its wire · double-click a label to straighten it">drag a rack by its title, a box, or a speed label to bend its wire · double-click a label to straighten it</span>

// ---- sizes, powers of 1,024 (decision 7) ----------------------------------------------------------------------------------
const UNITS = [['B', 1], ['KB', 1024], ['MB', 1024 ** 2], ['GB', 1024 ** 3], ['TB', 1024 ** 4]];
const unitOf = (u) => UNITS.find(x => x[0] === u)[1];

}

function bwOf(name) {
  const fromPairs = S.inspection?.pairs?.find(p => p.link === name && p.bandwidth > 0);

// ---- layout: racks round an ellipse, each box between the racks it serves, everything pushed apart; wires bend round boxes ----

function geometry(net) {

    case 'r-dev': { const dev = S.model.machines[S.modal.m].devices.find(d => d.key === el.dataset.d); S.modal = { ...S.modal, dev: dev.key, name: dev.names[0] }; render(); break; }
    case 'r-backend': S.modal = { ...S.modal, name: el.dataset.name }; render(); break;
    case 'r-unit': { const c = sizeCheck(S.modal), u = el.dataset.unit; S.modal = { ...S.modal, unit: u, size: S.modal.unit && c.bytes ? String(Math.floor(c.bytes / unitOf(u) * 100) / 100) : S.modal.size }; render(); break; }
    case 'r-half': case 'r-all': { const c = sizeCheck(S.modal); if (c.free != null) { const b = act === 'r-half' ? c.free / 2 : c.free; S.modal = { ...S.modal, size: S.modal.unit === 'B' ? String(Math.floor(b)) : String(Math.floor(b / unitOf(S.modal.unit) * 100) / 100) }; render(); } break; }
    case 'r-ok': commitRank(); break;
    case 'r-delete': { const m = S.model.machines[S.modal.m], r = m.ranks[S.modal.edit]; m.ranks.splice(S.modal.edit, 1); note('info', `${t('rank deleted')}: ${fmtB(r.bytes)} ${t('of')} ${m.name}`); S.modal = null; changed(); break; }
    case 'm-add-dev': S.modal.devices.push({ kind: 'gpu', backend: 'cuda' }); render(); break;
    case 'm-remove-dev': S.modal.devices.splice(+el.dataset.i, 1); render(); break;
    case 'm-ok': commitMachine(); break;
  }
});
function applyLink(id, value) {
  if (S.pendingFamily) delete S.pendingFamily[id];
  if (S.rateText) delete S.rateText[id];
  if (id === 'l-intra') setLink('intra', value);
  else if (id === 'l-inter') setLink('inter', value);
  else setLink('pair', value, S.sel.key);
}
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.dataset.link) {
    if (el.value.startsWith('@')) { (S.pendingFamily ||= {})[el.id] = el.value.slice(1); render(); $(el.id + '-rate')?.focus(); return; }
    if (S.pendingFamily) delete S.pendingFamily[el.id];
    applyLink(el.id, el.value);
    return;
  }
  if (el.dataset.mdev != null) { S.modal.devices[+el.dataset.mdev][el.dataset.prop] = el.value; render(); return; }
  switch (el.id) {
    case 'i-address': S.model.address = el.value; changed(); break;
    case 'i-seed': S.model.seed = el.value; changed(); break;
    case 'i-failures': S.model.failures = el.value; changed(); break;
    case 'i-run': pick(el.value); break;
    case 'i-collective': S.form.collective = el.value; break;
    case 'i-paused': S.form.paused = el.checked; break;
    case 'r-machine': { const m = +el.value, dev = S.model.machines[m].devices[0]; S.modal = { ...S.modal, m, dev: dev.key, name: dev.names[0] }; render(); break; }
    case 'f-kind': S.faultKind = el.value; S.faultFactor = null; render(); break;
    case 'f-rank': S.faultRank = el.value; break;
  }
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  switch (el.id) {
    case 'i-path': S.path = el.value; break;
    case 'i-command': S.form.command = el.value; break;
    case 'i-run-seed': S.form.seed = el.value; break;
    case 'i-follow': S.form.follow = el.value; break;
    case 'f-factor': S.faultFactor = el.value; break;
    case 'f-duration': S.faultDuration = el.value; break;
    case 'r-size': S.modal.size = el.value; render(); break;
    case 'm-name': S.modal.name = el.value; render(); break;
    default: if (/-rate$/.test(el.id)) (S.rateText ||= {})[el.id.slice(0, -5)] = el.value;
  }
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && S.modal) { S.modal = null; render(); }
  if (ev.key === 'Enter' && ev.target.id === 'r-size') commitRank();
  if (ev.key === 'Enter' && /-rate$/.test(ev.target.id || '')) document.querySelector(`[data-act="rate"][data-for="${ev.target.id.slice(0, -5)}"]`)?.click();
});
async function startRun() {
  try {
    if ((S.dirty || !S.file) && !(await save())) return;
    const body = { topology: S.file, command: S.form.command.trim(), mode: S.form.mode, paused: S.form.paused };
    if (S.form.collective) body.collective = S.form.collective;
    if (S.form.seed.trim()) body.seed = S.form.seed.trim();
    const run = await call('start', null, body);
    note('ok', `${t('started')} ${run.id}`);
    await refreshRuns(); pick(run.id);
  } catch (e) { note('err', e.message); render(); }
}
async function inject() {
  try {
    const kinds = S.machine?.fault_kinds || [];
    const kind = S.faultKind || kinds[0], r = +(S.faultRank ?? 0), world = R.world || allRanks().length || 1;
    const body = { kind, ranks: kind === 'LinkLoss' ? [r, (r + 1) % world] : [r], duration_ms: parseFloat(S.faultDuration || '0') || 0 };
    if (['SlowWorker', 'LinkLoss', 'LateJoin'].includes(kind)) body.factor = parseFloat(S.faultFactor ?? faultFactorDefault());
    const queued = await call('faults', { id: S.runId }, body);
    note('fault', `${t('queued')}: ${queued.kind} ${t('on rank(s)')} ${queued.ranks.join(', ')} · ${t('step')} ${queued.step}`);
    S.faultOpen = false;
  } catch (e) { note('err', e.message); }
  render();
}

// ---- dragging: a rack by its title, a box, or a wire's label (bends the wire) --------------------------------------------------
let drag = null, justDragged = false;
document.addEventListener('pointerdown', (ev) => {
  if (ev.button !== 0) return;
  const chip = ev.target.closest('.wchip'), node = ev.target.closest('[data-node]');
  if (chip) {
    const [qx, qy] = chip.dataset.q.split(',').map(Number), [mx, my] = chip.dataset.mid.split(',').map(Number);
    drag = { type: 'wire', id: chip.dataset.chip, sx: ev.clientX, sy: ev.clientY, q0: [qx, qy], mid: [mx, my], moved: false };
  } else if (node && S.geom) {
    const it = S.geom.items.find(x => x.id === node.dataset.node);
    if (it) drag = { type: 'node', id: it.id, sx: ev.clientX, sy: ev.clientY, ox: it.x, oy: it.y, w: it.w, h: it.h, moved: false };
  }
});
window.addEventListener('pointermove', (ev) => {
  if (!drag) return;
  const dx = (ev.clientX - drag.sx) / S.zoom, dy = (ev.clientY - drag.sy) / S.zoom;
  if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
  drag.moved = true;
  if (drag.type === 'node') S.dragging = { id: drag.id, x: Math.max(drag.w / 2 + 40, drag.ox + dx), y: Math.max(drag.h / 2 + 40, drag.oy + dy) };
  else S.bends[drag.id] = [drag.q0[0] + 2 * dx - drag.mid[0], drag.q0[1] + 2 * dy - drag.mid[1]];
  renderStage();
});
window.addEventListener('pointerup', () => {
  const d = drag;
  drag = null;
  if (!d || !d.moved) return;
  justDragged = true;
  setTimeout(() => { justDragged = false; }, 0);
  if (d.type === 'node') {
    renderStage();
    S.pos = {};
    for (const x of S.geom.items) S.pos[x.id] = [x.x, x.y];
    S.dragging = null;
    if (S.file) store.set('idrak-cluster-pos:' + S.file, S.pos);
  }
  render();
});
document.addEventListener('dblclick', (ev) => { const chip = ev.target.closest('.wchip'); if (chip) { delete S.bends[chip.dataset.chip]; render(); } });

// ---- wiring and start ---------------------------------------------------------------------------------------------------------
function wire() {
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  $('b-save').onclick = () => save();
  $('b-panel').onclick = () => { S.panel = !S.panel; $('panel').classList.toggle('hidden', !S.panel); render(); };
  let resized = null;
  window.addEventListener('resize', () => { clearTimeout(resized); resized = setTimeout(render, 150); });
  $('b-tidy').onclick = () => { S.pos = {}; S.bends = {}; if (S.file) store.set('idrak-cluster-pos:' + S.file, {}); note('info', t('laid out again; your positions and bends cleared')); render(); };
  $('b-zoom-in').onclick = () => { S.zoom = Math.min(1.6, Math.round((S.zoom + 0.1) * 10) / 10); lastStage = ''; render(); };
  $('b-zoom-out').onclick = () => { S.zoom = Math.max(0.4, Math.round((S.zoom - 0.1) * 10) / 10); lastStage = ''; render(); };
  $('b-add-machine').onclick = () => openMachine(null);
  $('b-add-rank').onclick = () => openRank(S.sel.kind === 'machine' ? S.sel.i : 0, null, null);
  $('legend').addEventListener('click', (ev) => { if (ev.target.closest('#b-tx')) { S.tx = !S.tx; lastStage = ''; render(); } });
  $('b-key').onclick = () => { S.key = $('key').value; try { sessionStorage.setItem('idrak-cluster-key', S.key); } catch { /* private window */ } $('keybox').classList.add('hidden'); start(); };
}
async function start() {
  try {
    S.machine = await call('machine');
    note('info', `${t('this machine')}: ${S.machine.host} · ${factsDevices().map(d => `${d.label} (${d.names.join(', ')})${d.physical != null ? ' ' + fmtB(d.physical) : ''}`).join(', ')}${S.machine.adapter ? ' · ' + S.machine.adapter : ''}`);
    await open(S.machine.topology || '');
    if (S.machine.follow) {
      S.mode = 'run';
      try { const run = await call('start', null, { follow: S.machine.follow }); await refreshRuns(); pick(run.id); } catch (e) { note('err', e.message); }
    }
    await refreshRuns();
    if (!S.runId) { const going = S.runs.find(r => !['stopped', 'finished', 'failed'].includes(r.state)); if (going) { S.mode = 'run'; pick(going.id); } }
    render();
    setInterval(refreshRuns, 2000);
  } catch (e) { if (e.status !== 401) say(e.message, true); }
}
wire();
start();
</script>
