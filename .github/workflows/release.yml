name: Release

# Push a tag such as v0.1.0 to build, test, pack every package with that version and publish it to nuget.org.
# Needs the repository secret NUGET_API_KEY (nuget.org > API Keys, scope "Push", glob "Idrak*").
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet build Idrak.slnx -c Release -p:Version=$VERSION
      - run: dotnet run -c Release --no-build --project tests/Idrak.Tests
        env:
          IDRAK_DEVICES: cpu
      - name: Pack (every project under src/)
        run: for p in src/*/*.csproj; do dotnet pack "$p" -c Release --no-build -p:Version=$VERSION -o artifacts; done
      - name: Publish to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "Idrak $VERSION" --notes "See CHANGELOG.md."
