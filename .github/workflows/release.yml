name: Release

# Run by hand only (Actions > Release > Run workflow, with a version such as 0.4.0): it checks out the tag v<version>,
# builds, tests, packs every package with that version and publishes it to nuget.org. Pushing a tag publishes nothing.
# Publishing uses nuget.org Trusted Publishing (no stored API key): nuget.org > your account > Trusted Publishing has a
# policy for owner ahmedseada, repository Idrak, workflow release.yml; the repository secret NUGET_USER holds the
# nuget.org user name (not the e-mail address). The login step trades GitHub's token for a key that lasts one hour.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to publish, without the v (the tag v<version> must exist)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from the input
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "VERSION=${INPUT_VERSION#v}" >> "$GITHUB_ENV"
      - run: dotnet build Idrak.slnx -c Release -p:Version=$VERSION
      - run: dotnet run -c Release --no-build --project tests/Idrak.Tests
        env:
          IDRAK_DEVICES: cpu
      - run: dotnet run -c Release --no-build --project samples/Idrak.Samples.Override.Tests
      - run: dotnet run -c Release --no-build --project samples/Idrak.Samples.ArabicOcr.Tests
        env:
          IDRAK_DEVICES: cpu
      - name: Pack (every project under src/)
        run: for p in src/*/*.csproj; do dotnet pack "$p" -c Release --no-build -p:Version=$VERSION -o artifacts; done
      - name: Log in to nuget.org (Trusted Publishing)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" artifacts/*.nupkg --verify-tag --title "Idrak $VERSION" --notes "$(pwsh tools/github-release.ps1 -Version "$VERSION" -NotesOnly)"
